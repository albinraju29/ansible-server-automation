---
- name: Install nginx
  apt:
    name: nginx
    state: present
    update_cache: yes

- name: Start and enable nginx
  service:
    name: nginx
    state: started
    enabled: yes

- name: Create simple homepage
  copy:
    dest: /var/www/html/index.html
    content: |
      <h1>Welcome from Ansible - Managed by {{ ansible_hostname }}</h1>

